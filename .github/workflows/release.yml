name: Build and Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Stamp version from tag into backend/__version__.py
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "__version__ = \"$VERSION\"" > backend/__version__.py
          cat backend/__version__.py
      - run: pyinstaller charger_jig.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ChargerTestingJIG.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
